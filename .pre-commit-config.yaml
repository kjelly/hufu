repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # These fixtures are addressed by the SHA-256 of their exact bytes.
        exclude: ^docs/archive/implementation-plans/universal-decision-contracts-v2/fixtures/artifacts/
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: reject-docs-tmp
        name: reject docs/tmp files
        entry: docs/tmp/ is scratch space; move retained files to the appropriate permanent docs/ directory before staging
        language: fail
        files: ^docs/tmp/
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint (via mise)
        entry: mise exec -- golangci-lint run
        language: system
        types: [go]
        args: [--timeout, 5m]
        pass_filenames: false
