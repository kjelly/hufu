repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (via mise)
        entry: mise exec -- golangci-lint run
        language: system
        types: [go]
        args: [--timeout, 5m]
        pass_filenames: false
