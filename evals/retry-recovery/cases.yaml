# verifier-failure-retry originally pinned a real internal/team bug (fixed
# 2026-09-12): submitResultRuntimeIdentityFromContext's primary identity
# came up missing on every retry attempt because CommitTaskTransition (run
# for attempt > 1 to mark the retry in-progress) unconditionally bumps
# OccurrenceRevision and revokes the task's current occurrence lease --
# including the fresh one this same retryLoop iteration's
# setCurrentTaskAttempt had just opened moments earlier -- so a retried
# worker's own resubmission always fell back to invocationMetadataFromContext,
# whose identity can never carry an OccurrenceRevision/DispatchID and so
# can never pass validSubmitResultIdentity. Fixed in
# internal/team/coordinator_task_run.go by re-calling setCurrentTaskAttempt
# right after the transition commit, so the occurrence is reopened before
# the attempt's own dispatch needs it. This case's `verify: "exit 1"`
# always fails (a fully static, stateless check), so it now exercises
# genuine retry-then-resubmission all the way to a real, correctly
# classified verification failure once retries are exhausted -- not the
# protocol-identity error the bug used to produce.
version: 1
name: retry-recovery
team: ./team
mode: deterministic
cases:
  - id: verifier-failure-retry
    prompt: "Report a status flag."
    provider-fixture: fixtures/verifier-failure-retry.json
    expect:
      run-outcome: partial
      task-count: 1
      tasks:
        - agent: worker
          status: error
          verification: failed
          failure-class: verification
          attempts: 2
      events:
        required: [start, verify_start, verify_error, done]
        order: [start, verify_error, verify_error, done]
        counts:
          - type: verify_error
            count: 2
