version: 1
name: policy-repair-exhaustion
team: ./team
mode: deterministic
cases:
  # The first call is caught by the coordinator's argument-schema repair
  # (the agent enum only lists "worker"); the next three are rejected by the
  # delegation allowlist and exhaust the coordinator policy-repair budget
  # (maxCoordinatorPolicyRepairs = 2). The run must end with the runtime's
  # LLM-free partial summary, not as a coordinator tool failure, and no model
  # turn may follow the exhausting call (the scripted provider has no step
  # left to answer one).
  - id: allowlist-violations-exhaust-repair
    prompt: "Say hello to the user."
    provider-fixture: fixtures/allowlist-violations-exhaust-repair.json
    expect:
      run-outcome: unverified
      task-count: 0
