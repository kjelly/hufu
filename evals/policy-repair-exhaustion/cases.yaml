version: 1
name: policy-repair-exhaustion
team: ./team
mode: deterministic
cases:
  # The worker succeeds, then the coordinator redispatches it three times.
  # Each redispatch is schema-valid but violates no-redispatch-after-success,
  # so the policy repair budget (maxCoordinatorPolicyRepairs = 2) is spent and
  # the third violation exhausts it. The run must end with the runtime's
  # LLM-free partial summary, not as a coordinator tool failure, and no model
  # turn may follow the exhausting call (the scripted provider has no step
  # left to answer one).
  - id: redispatch-violations-exhaust-repair
    prompt: "Say hello to the user."
    provider-fixture: fixtures/redispatch-violations-exhaust-repair.json
    expect:
      run-outcome: unverified
      task-count: 1
      tasks:
        - agent: worker
          status: done
