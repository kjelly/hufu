version: 1
name: coordinator-tool-recovery
team: ./team
mode: deterministic
cases:
  # A coordinator tool error response is feedback the model can act on. The
  # first call (team_info) moves the stream past step 0, so the rejected
  # dispatch below runs on a later step. Its verify command fails the
  # contract preflight (verifier_not_asserting); the coordinator must see
  # that error and continue with a corrected dispatch instead of the run
  # ending as a coordinator tool failure.
  - id: rejected-verify-is-corrected
    prompt: "Say hello to the user."
    provider-fixture: fixtures/rejected-verify-is-corrected.json
    expect:
      run-outcome: unverified
      task-count: 1
      tasks:
        - agent: worker
          status: done
  # The schema-repair wrapper and policy gate must stay in front of the
  # coordinator's tools on every step, not only the first. The unknown agent
  # name on a later step must be answered by the argument-schema repair
  # prompt, which the next scripted step matches on; if later steps bypassed
  # the wrapper, the dispatch would reach the agent resolver instead and the
  # matching step would never be consumed.
  - id: later-step-schema-repair
    prompt: "Say hello to the user."
    provider-fixture: fixtures/later-step-schema-repair.json
    expect:
      run-outcome: unverified
      task-count: 1
      tasks:
        - agent: worker
          status: done
