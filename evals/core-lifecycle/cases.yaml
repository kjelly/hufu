version: 1
name: core-lifecycle
team: ./team
mode: deterministic
cases:
  - id: single-task-unverified
    prompt: "Say hello to the user."
    provider-fixture: fixtures/single-task-unverified.json
    expect:
      run-outcome: unverified
      acceptance: not_configured
      audit-verdict: pass
      terminal-lifecycle-confirmed: true
      task-count: 1
      no-unauthorized-fallback: true
      evidence:
        manifest-exists: true
        hash-valid: true
        status: unverified
        min-artifact-refs: 1
        required-results:
          - task-index: 0
            status: passed
            min-artifact-refs: 1
        required-artifact-refs:
          - kind: application/x-ndjson
            task-index: 0
            min-count: 1
      tasks:
        - agent: worker
          status: done
          verification: not-run
          execution-target: ollama/eval-harness-model
          backend-binding:
            backend: ollama
      events:
        required: [start, todos_updated, done]
        order: [start, todos_updated, done]
        matches:
          - type: start
            occurrence: 2
            fields:
              agent: worker
              task_index: 0
              execution_target: ollama/eval-harness-model
              backend: ollama
