# GoReleaser config for kjelly/hufu.
# Source of truth for the release target: the `release.github` block below.
# The module path and release owner both identify the kjelly/hufu fork.
version: 2

project_name: hufu

builds:
  - id: hufu
    main: ./cmd/hufu
    binary: hufu
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: kjelly
    name: hufu
  header: |
    ## Execution compatibility warning

    The `local` execution-backend alias and provider-era durable execution
    identity are deprecated. Before upgrading a workspace, make a complete
    backup and inspect it before applying the append-only migration:

    ```bash
    hufu migrate inspect-execution --workspace <path>
    hufu migrate apply-execution --workspace <path> --apply
    ```

    The apply command appends canonical migration events and rebuilds the
    active projection; it never rewrites or truncates event history. To roll
    back, stop Hufu and restore the complete pre-migration workspace backup.
    Do not delete or truncate individual migration events.
