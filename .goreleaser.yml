# GoReleaser config for kjelly/hufu.
# Source of truth for the release target: the `release.github` block below.
# Module path is intentionally left as github.com/anomalyco/hufu so go
# module consumers that pin to the original project keep working; this
# fork is published as prebuilt binaries only.
version: 2

project_name: hufu

builds:
  - id: hufu
    main: ./cmd/hufu
    binary: hufu
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: kjelly
    name: hufu
