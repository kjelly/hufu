name: hufu-coding
description: "Hufu-owned SA -> Codex coder -> verify -> review -> final-SA coding workflow"
max-rounds: 64
max-steps: 96
timeout: 3600
verify-timeout: 1800
max-retries: 2
max-concurrent: 1
workspace: workspace
goal-mode: outcome
execution-profile: fresh-session
unattended: true
max-duration: 21600
max-total-tokens: 0
allow-free-text-results: false

subagent-providers:
  codex:
    type: codex-app-server
    command: [codex, -c, "agents.enabled=false", -c, "features.multi_agent_v2=false", app-server]
    startup-timeout: "30s"
    interrupt-grace: "5s"
    shutdown-grace: "5s"
    inherit-env: [PATH, CODEX_HOME, HOME]

delegation:
  bind-task-goal-contracts: true
  allowed-workers: [sa, coder, verifier, reviewer, final-sa]
  no-redispatch-after-success: [sa]

acceptance:
  mode: blocking
  require-no-unresolved-tasks: true

# Static task contracts freeze side effect, provider-relevant execution
# semantics, retry budget, and (for verifier/reviewer/final-sa) the
# on-failure-classes reliability policy per role. The coordinator's own
# dynamic batch call only ever supplies goal/depends_on/on_failure — it
# cannot widen a role's side effect or bypass the failure-class gate below.
# Each agent below has exactly one contract, so contract binding never
# depends on the coordinator repeating the literal goal token verbatim
# (internal/team/contract_compile.go: a worker with exactly one configured
# goal contract binds by agent identity alone).
#
# Deliberately no verify-spec here: a task_result_assert verify-spec enforces
# its assertions at submit_result *admission* time (task_result_contract.go),
# rejecting the tool call itself when an assertion fails. That is correct for
# a protocol-completeness check (e.g. hufu-code-review's "files_read must be
# non-empty") but wrong for a semantic verdict — it would make an honest,
# confirmed defect literally un-submittable, since the assertion could never
# pass for a worker that truthfully found one. Instead, verifier/reviewer/
# final-sa report their verdict directly via `status`: `success` for a clean
# pass, `failed` for a confirmed rejection (see each agent's own .md for the
# exact contract), `blocked`/`partial` for an evidence gap or infra problem
# they could not resolve themselves.
#
# `on-failure-classes: [verification, semantic_rejection]` below names two
# distinct things: `verification` is defense-in-depth for a future
# VerifyCommandExit-style check that might genuinely produce that raw class;
# `semantic_rejection` is what a genuine `status: failed` self-report is
# actually canonicalized to. Hufu's own generic non-terminal-status handling
# (coordinator_task_run.go) persists any non-success status uniformly as
# TaskFailureClass=execution — the same raw class an infra failure gets, so
# the raw class alone can never authorize this edge. Instead,
# dagScheduler.handleEvent (dag_scheduler.go, effectiveFailureClassForTodo)
# canonicalizes a complete, honest worker self-report of failure to
# `semantic_rejection` *before* checking it against this allowlist, so "the
# worker said failed" is subject to the exact same allowlist check as any
# other class — never a separate bypass condition alongside it. Naming
# `semantic_rejection` here is what actually authorizes the reset; omitting
# it would make every genuine `status: failed` report fail closed instead
# (see dag_scheduler.go's selfHealEligibleFailureClass) rather than silently
# ignored.
tasks:
  - agent: sa
    when-goal-contains: "SA_ANALYZE"
    side_effect: none
    recovery: retry
    max_retries: 2
    execution:
      requires-result: true
      requires-grounded-result: true

  - agent: coder
    when-goal-contains: "CODER_IMPLEMENT"
    side_effect: workspace_write
    recovery: retry
    max_retries: 2
    execution:
      requires-result: true

  - agent: verifier
    when-goal-contains: "VERIFY_IMPLEMENTATION"
    side_effect: none
    recovery: retry
    max_retries: 4
    on-failure-classes: [verification, semantic_rejection]
    execution:
      requires-result: true
      requires-grounded-result: true

  - agent: reviewer
    when-goal-contains: "REVIEW_CODE"
    side_effect: none
    recovery: retry
    max_retries: 4
    on-failure-classes: [verification, semantic_rejection]
    execution:
      requires-result: true
      requires-grounded-result: true

  - agent: final-sa
    when-goal-contains: "FINAL_SA_GATE"
    side_effect: none
    recovery: retry
    max_retries: 2
    on-failure-classes: [verification, semantic_rejection]
    execution:
      requires-result: true
      requires-grounded-result: true
