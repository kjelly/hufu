apiVersion: hufu.io/v1alpha1
kind: AgentTeam
metadata:
  name: strategic-decision
spec:
  description: >
    Evidence-first decision team with outside view, isolated judgments,
    deterministic aggregation, premortem, no-go alternatives, and
    explicit dissent. Adapted from spec.md against Hufu's actual
    decision-aware runtime schema (internal/agent/decision_config.go,
    internal/team/parse.go) — see README.md in this directory for every
    point where spec.md's proposed team.yaml did not match the real,
    strict (KnownFields) parser and had to be corrected.

  max-rounds: 10
  max-steps: 20
  timeout: 600
  max-retries: 2
  max-concurrent: 5

  # REQUIRED, and not mentioned anywhere in spec.md: the whole decision engine
  # is driven by one non-tool-using "judge sidecar" model
  # (internal/team/decision_runners.go). Without judge-model, every task that
  # resolves to a non-off decision profile fails closed with "needs a judge
  # model and none is configured" (internal/team/decision_dispatch.go:178).
  # Point this at a model already configured for this environment (see
  # `hufu models` / your provider config) before running this team.
  judge-model: CHANGE_ME_TO_A_CONFIGURED_MODEL_ID

  # REQUIRED for the capability-routed REFERENCE stage (see
  # decision.profiles.*.outside-view.role below): reference.md and
  # reference-specialist.md don't declare their own model, so both fall back to
  # this team default. Same placeholder as judge-model — fill both in.
  model: CHANGE_ME_TO_A_CONFIGURED_MODEL_ID

  # Maintainer-declared capability evidence (plan.md Stage 8;
  # internal/agent/agent.go DeclaredCapability). This is the trust tier above a
  # worker's own self-declared capabilities (extracted from its system prompt) —
  # a human wrote this, the agent did not claim it about itself. See README.md
  # "Gap 1" for what this now genuinely changes at runtime.
  capability-registry:
    reference:
      - capability: evidence-research
        confidence: 0.5
        cost-class: medium
      - capability: decision-analysis
        confidence: 0.5
        cost-class: medium
    reference-specialist:
      - capability: evidence-research
        confidence: 0.7
        cost-class: low
      - capability: architecture
        confidence: 0.7
        cost-class: low
      - capability: decision-analysis
        confidence: 0.6
        cost-class: low
      - capability: adversarial-analysis
        confidence: 0.6
        cost-class: low
    juror:
      - capability: decision-analysis
        confidence: 0.7
        cost-class: high
      - capability: adversarial-analysis
        confidence: 0.5
        cost-class: high
    challenger:
      - capability: adversarial-analysis
        confidence: 0.7
        cost-class: medium

  # Cost-aware weighted scoring (spec.md v2 §12): CapabilityRegistry.scoreAgent
  # already contributes required/preferred capability matches at weight
  # 1.0/0.5 with no config at all (internal/team/capability_registry.go). This
  # block adds a small cost term on top, using the cost-class declarations
  # above. At 0.05 it never overrides this team's primary rankings — it only
  # breaks a near-tie in reference-specialist's favor (it declares cost-class:
  # low throughout) — because the 0.1-0.2 capability-confidence gaps between
  # this team's candidates already dominate at the default weights. See
  # internal/team/capability_registry_test.go's
  # TestCapabilityRegistry_CostWeightAffectsRanking for a case where a larger
  # cost weight does flip a ranking between equal-confidence candidates.
  routing-policy:
    scoring:
      weights:
        cost: 0.05

  # Goal-driven routing hints (spec.md v2 §16): unlike the block above, this
  # one *does* visibly change a ranking — but only for a decision whose
  # question actually matches. A judge-role/challenge-role query for a
  # storage-related question gets "architecture" added to its preferred list;
  # reference-specialist (architecture: 0.7) already wins REFERENCE outright,
  # but for JUDGE this pushes reference-specialist's score from 0.6 to
  # 0.6+0.5*0.7=0.95, past juror's plain 0.7 — so judge-1 binds to
  # reference-specialist instead of juror specifically for storage questions,
  # and nowhere else. See
  # TestJudgeRoleCapabilityRouting_HintsChangeBindingAndRevisionReusesIt.
  # Decision workers should not mutate workspace/external state.
  tools:
    allowed:
      - view
      - grep
      - glob
      - ls

  project-context: true

  # Decision orchestration belongs to DecisionEngine, not to a runtime-owned
  # phase workflow.
  workflow:
    phases: []

  delegation:
    # NOTE (runtime gap, see README.md "Gap 1" — now resolved for every routed
    # role spec2.md defines): PREMORTEM/FINALIZE still call the team's
    # judge-model sidecar directly (internal/team/decision_runners.go) — that
    # is by spec2.md's own design, not a gap (§9/§10: AGGREGATE/FINALIZE are
    # never capability-routed roles). REFERENCE, JUDGE, and CHALLENGE are all
    # genuinely capability-routed to whichever of
    # reference/reference-specialist/juror/challenger below qualifies
    # (internal/team/decision_reference_capability_runner.go,
    # internal/team/decision_judge_capability_runner.go,
    # internal/team/decision_challenge_capability_runner.go); REVISE reuses
    # whichever judge candidate JUDGE round 1 already bound, by construction
    # (spec2.md §8), not a fourth independent routed role. This
    # allowed-workers list is exactly the eligible/authorized set that routing
    # is only ever allowed to narrow, never expand
    # (Coordinator.eligibleWorkerIDs).
    allowed-workers:
      - reference
      - reference-specialist
      - juror
      - challenger
    forbid-context-files: false

  # REQUIRED, and not mentioned in spec.md: prepareTaskDecision refuses to form
  # any decision unless decision.request-contract.enabled is true
  # (internal/team/decision_dispatch.go:106-108). Objective/success-criteria are
  # fixed per team (not something the coordinator can author per request: see
  # README.md "Gap 2"), so keep this generic across whatever question the
  # coordinator delegates as the task Goal.
  decision:
    # Goal-driven routing hints (spec.md v2 §16): unlike the routing-policy
    # cost weight above, this one *does* visibly change a ranking — but only
    # for a decision whose question actually matches. A judge-role/
    # challenge-role query for a storage-related question gets "architecture"
    # added to its preferred list; reference-specialist (architecture: 0.7)
    # already wins REFERENCE outright, but for JUDGE this pushes
    # reference-specialist's score from 0.6 to 0.6+0.5*0.7=0.95, past juror's
    # plain 0.7 — so judge-1 binds to reference-specialist instead of juror
    # specifically for storage questions, and nowhere else. See
    # TestJudgeRoleCapabilityRouting_HintsChangeBindingAndRevisionReusesIt.
    routing-hints:
      - when-goal-contains: storage
        preferred-capabilities:
          - architecture

    request-contract:
      enabled: true
      objective: >
        Reach the highest-quality decision on the request the coordinator
        delegates, using sealed independent judgment and evidence rather than
        the model's own first instinct.
      success-criteria:
        - id: sealed-judgment
          statement: >
            The chosen option was scored by independently sealed judges against
            a deterministic aggregate, not by a single pass of reasoning.
        - id: legitimate-alternative
          statement: >
            A no-go / defer / reduce-scope / request-information alternative
            was considered on equal footing and was not excluded by default.

    default-profile: standard

    # These local names consume Decision Runtime's versioned built-ins. The
    # team still owns authorization, routing hints, and request intent above.
    profiles:
      light:
        preset: builtin/light@v1
      standard:
        preset: builtin/standard@v1
      high-stakes:
        preset: builtin/high-stakes@v1

  max-total-tokens: 200000
  max-duration: 3600

  reliability:
    hard-enforcement: true
