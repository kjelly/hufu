apiVersion: hufu.io/v1alpha1
kind: AgentTeam
metadata:
  name: operator
spec:
  description: "Strict plan-execution team — decomposes a user plan into sub-tasks and executes them faithfully without deviation"
  max-rounds: 30
  max-steps: 50
  timeout: 1800
  temperature: "0.2"
  max-tokens: "4096"
  # The System One decision endpoint; override per machine with a hufu.yaml
  # `vars:` entry or --var systemone_endpoint=...
  vars:
    systemone_endpoint: http://127.0.0.1:11434/v1/systemone
  # Bounded helper decisions the executor asks before acting
  # (docs/reference/decision-primitives.md).
  decision-primitives:
    step-risk:
      backend: systemone
      endpoint: "{@ .systemone_endpoint @}"
      model: nimble
      version: "1"
      kind: choice
      question: "Classify the risk of carrying out the plan step described in state.step."
      options:
        - id: read-only
          description: "Only reads or inspects files, the repository, or system state."
        - id: workspace-write
          description: "Creates, edits, or deletes files inside the current working directory."
        - id: system-change
          description: "Changes state outside the working directory: packages, services, system configuration, or other files."
        - id: destructive
          description: "Irreversibly deletes or overwrites data outside the working directory, or force-pushes."
      inputs: {step: string}
      agents: [executor]
      # nimble needs about 11s on a cold start; the runtime allows at most 30s.
      timeout: 20s
      min-confidence: 0.6
      max-calls: 200
      # The runtime enforces the executor's rule: after either answer the
      # attempt cannot change anything and may only report blocked.
      block-on: [system-change, destructive]
