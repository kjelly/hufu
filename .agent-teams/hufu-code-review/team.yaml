apiVersion: hufu.io/v1alpha1
kind: AgentTeam
metadata:
  name: hufu-code-review
spec:
  description: "Read-only, artifact-backed review of the Hufu Go codebase"
  coordinator-model: ollama/minimax-m3:cloud
  # Every worker runs on the hufu.yaml `review` route and falls back to its
  # next candidate on a provider outage. Workers must not set their own
  # model; -m/--model or --worker-model replace the route for a run.
  execution-route: review
  max-rounds: 64
  max-steps: 120
  timeout: 3600
  verify-timeout: 120
  max-retries: 1
  max-concurrent: 3
  workspace: workspace
  goal-mode: outcome
  execution-profile: fresh-session
  # Memory learning stays off. Every review task runs in the verify phase,
  # which receives only memory explicitly activated for verify, so reviews
  # never apply learned knowledge and stay independent of earlier findings;
  # turning learning on would only pile up knowledge no reviewer reads.
  unattended: true
  # This team is read-only. No rollback command is configured: acceptance
  # failure must fail closed without modifying the repository.
  max-duration: 86400
  max-total-tokens: 0
  no-net: true
  allow-free-text-results: false

  inputs:
    review.scope:
      type: object
      required: true
      default:
        kind: last_n
        count: 10
        history: first_parent
        head: HEAD
      properties:
        kind:
          type: string
          enum: [last_n, revision_range, since, working_tree]
        count:
          type: integer
          minimum: 1
          maximum: 100
        history:
          type: string
          enum: [first_parent]
        head:
          type: string
          min-length: 1
          max-length: 160
        # An empty base or since would be frozen verbatim while the producer
        # omits it, so equals_input could never pass; min-length sends such a
        # candidate back for repair instead.
        base:
          type: string
          min-length: 1
          max-length: 160
        since:
          type: string
          min-length: 1
          max-length: 80
        commit_type:
          type: string
          enum: [feat]
      required-properties: [kind, history, head]
      additional-properties: false
      resolver:
        id: review-scope-v1
        capability: resolve-review-scope
        type: resolve_review_scope
        mode: semantic_json
        source: invocation_prompt
        side_effect: none
        timeout: 10
        semantic-guidance: |
          Interpret only the requested Git review scope; do not infer it from domain keywords.
          A named commit or "latest commit" means kind=last_n with count=1 and head set to that revision or HEAD.
          "Latest N commits" means kind=last_n with count=N and the requested head, defaulting to HEAD.
          An explicit base and head means kind=revision_range with those two revisions.
          A YYYY-MM-DD lower bound means kind=since with since set to that date.
          kind=working_tree is only for staged, unstaged, or untracked changes, always uses head=HEAD, and never carries count, base, since, or commit_type.
          Never use kind=working_tree for a named commit, commit hash, committed revision, or commit history.
          Set commit_type only when the request explicitly limits the review to commits of that type, such as "feat commits".
          Always set history=first_parent, the only supported history mode.
          Omit every property the request does not state; never set a property to an empty string.
          Return null when the scope remains ambiguous.

  # No agent selects codex by default. This configures the codex backend for
  # `--worker-model <agent>=codex/<model>` runs; the built-in defaults would
  # not pass HOME through inherit-env.
  subagent-providers:
    codex:
      type: codex-app-server
      command: [codex, app-server]
      startup-timeout: "30s"
      interrupt-grace: "5s"
      shutdown-grace: "5s"
      max-event-bytes: 16777216
      max-transcript-bytes: 16777216
      max-concurrent: 1
      inherit-env: [PATH, CODEX_HOME, HOME]

  # PREPARE produces immutable inputs; VERIFY reviews, synthesizes, and runs
  # the side-effect-free report audit before the workflow can reach DONE.
  workflow:
    phases: [prepare, verify]
  policies:
    require_phase_success: true
    allow_phase_skip: true
    fail_fast: true
  capabilities:
    required: [produce-workset, verify-review-tests, inventory-review-handoffs, verify-review-report]
  verification:
    required: true
  retry:
    transient:
      max_attempts: 1
    repair:
      max_attempts_per_failure_signature: 1

  action-providers:
    resolve-review-scope:
      runtime: golang
      source: ./reviewprep
      mode: trusted-static
      timeout: 30
    produce-workset:
      runtime: golang
      source: ./reviewprep
      mode: trusted-static
      timeout: 300
    verify-review-tests:
      runtime: golang
      source: ./reviewprep
      mode: trusted-static
      timeout: 1200

    verify-review-report:
      runtime: golang
      source: ./reviewgate
      mode: trusted-static
      timeout: 30

    inventory-review-handoffs:
      runtime: golang
      source: ./reviewgate
      mode: trusted-static
      timeout: 30

  delegation:
    bind-task-goal-contracts: true
    forbid-context-files: true
    allowed-workers: [reviewer, documentation-reviewer, critic, synthesizer]
    no-redispatch-after-success: [reviewer, documentation-reviewer, synthesizer]

  acceptance:
    mode: blocking
    require-no-unresolved-tasks: true
    verifications:
      - type: task_output_assert
        source-task: verify-review-report
        output: review_report_verification
        assertions:
          - { pointer: /passed, op: equals, value: true }
      - type: task_output_assert
        source-task: produce-workset
        output: scope
        assertions:
          - { pointer: /requested, op: equals_input, input: review.scope }
          - { pointer: /requested_input_hash, op: equals_input_hash, input: review.scope }
          - { pointer: /satisfied, op: equals, value: true }
          - { pointer: /observed_budget/changed_paths, op: minimum, value: 1 }
      - type: task_output_assert
        source-task: verify-targeted-go-tests
        output: scope
        assertions:
          - { pointer: /requested, op: equals_input, input: review.scope }
          - { pointer: /requested_input_hash, op: equals_input_hash, input: review.scope }
          - { pointer: /satisfied, op: equals, value: true }
      - type: task_output_assert
        source-task: verify-targeted-go-tests
        output: targeted_go_tests
        assertions:
          - { pointer: /passed, op: equals, value: true }
      - type: task_output_assert
        source-task: produce-workset
        output: documentation_verification
        assertions:
          - { pointer: /passed, op: equals, value: true }
      - type: workset_complete
        source-task: review-primary-workset
        require-all-terminal: true
        require-all-verified: true
        accepted-statuses: [success, completed_with_gaps]
      - type: workset_complete
        source-task: review-documentation-workset
        require-all-terminal: true
        require-all-verified: true
        accepted-statuses: [success, completed_with_gaps]
      - type: workset_complete
        source-task: review-documentation-escalation
        require-all-terminal: true
        require-all-verified: true
        accepted-statuses: [success, completed_with_gaps]
      - type: task_output_assert
        source-task: inventory-review-handoffs
        output: review_handoff_inventory
        assertions:
          - { pointer: /passed, op: equals, value: true }

  # The producer, snapshot-pinned Go verifier, and all three routed worksets
  # and the final report audit are blocking. Critic dispatch is conditional
  # on typed requires_critique; every dispatched critic audits one source.
  tasks:
    - id: produce-workset
      agent: reviewer
      phase: prepare
      side_effect: none
      recovery: retry
      action:
        capability: produce-workset
        type: prepare_review_workset
        payload: >-
          {"scope":{"kind":"last_n","count":10,"history":"first_parent","head":"HEAD"},"routing":"documentation","max_total_diff_bytes":2097152,"max_total_diff_lines":30000,"max_changed_paths":256,"max_workset_items":32,"max_diff_bytes":96000,"max_diff_lines":2000,"max_paths":32}
        input-bindings:
          - input: review.scope
            target: /scope

    - id: verify-targeted-go-tests
      agent: reviewer
      phase: prepare
      side_effect: none
      recovery: retry
      action:
        capability: verify-review-tests
        type: verify_review_tests
        payload: >-
          {"scope":{"kind":"last_n","count":10,"history":"first_parent","head":"HEAD"}}
        input-bindings:
          - input: review.scope
            target: /scope

    - id: review-primary-workset
      agent: reviewer
      phase: verify
      invariant-verification: report
      result-contract: { schema: schemas/review-v1.json, require-structured: true }
      fan_out:
        source-artifact:
          task_id: produce-workset
          artifact: primary review workset manifest
        goal-template: 'Review primary workset item {key} with the {lens} lens. Result identity: record.workset_key="{key}", record.review_revision="{review_revision}", record.lens="{lens}". The item key is distinct from the Workset ID.'
      execution:
        requires-result: true
        requires-grounded-result: true
        forbid-artifacts: true
      verify-spec:
        type: task_result_assert
        task-result-assertions:
          - { pointer: /summary, op: non_empty }
          - { pointer: /files_read, op: min_items, value: 1 }
          - pointer: /findings
            op: equals_projection
            value:
              pointer: /structured_payload/value/record/findings
              fields: [summary, detail, severity]
              allow_missing: true

    - id: review-documentation-workset
      agent: documentation-reviewer
      phase: verify
      result-contract: { schema: schemas/review-v1.json, require-structured: true }
      fan_out:
        source-artifact:
          task_id: produce-workset
          artifact: documentation review workset manifest
        goal-template: 'Review routine documentation workset item {key} with the {lens} lens. Result identity: record.workset_key="{key}", record.review_revision="{review_revision}", record.lens="{lens}". The item key is distinct from the Workset ID.'
      execution:
        requires-result: true
        requires-grounded-result: true
        forbid-artifacts: true
      verify-spec:
        type: task_result_assert
        task-result-assertions:
          - { pointer: /summary, op: non_empty }
          - { pointer: /files_read, op: min_items, value: 1 }
          - pointer: /findings
            op: equals_projection
            value:
              pointer: /structured_payload/value/record/findings
              fields: [summary, detail, severity]
              allow_missing: true

    - id: review-documentation-escalation
      agent: critic
      phase: verify
      result-contract: { schema: schemas/review-v1.json, require-structured: true }
      fan_out:
        source-artifact:
          task_id: produce-workset
          artifact: documentation escalation workset manifest
        goal-template: 'Adversarially review escalated documentation workset item {key} with the {lens} lens. Result identity: record.workset_key="{key}", record.review_revision="{review_revision}", record.lens="{lens}". The item key is distinct from the Workset ID.'
      execution:
        requires-result: true
        requires-grounded-result: true
        forbid-artifacts: true
      verify-spec:
        type: task_result_assert
        task-result-assertions:
          - { pointer: /summary, op: non_empty }
          - { pointer: /files_read, op: min_items, value: 1 }
          - pointer: /findings
            op: equals_projection
            value:
              pointer: /structured_payload/value/record/findings
              fields: [summary, detail, severity]
              allow_missing: true

    - id: critic-review
      agent: critic
      phase: verify
      optional: true
      result-contract: { schema: schemas/critique-v1.json, require-structured: true }
      execution:
        requires-result: true
        requires-grounded-result: true
        # The critic checks every finding of one completed review. Without
        # evidence_from it has neither the finding nor the diff and snapshot
        # artifacts that review was given.
        requires-evidence: true
        max-evidence-sources: 1
      verify-spec:
        type: task_result_assert
        task-result-assertions:
          - { pointer: /summary, op: non_empty }

    # These follow-up contracts are optional to the phase batch scheduler;
    # the blocking report audit acceptance makes their results mandatory.
    - id: inventory-review-handoffs
      agent: reviewer
      phase: verify
      optional: true
      side_effect: none
      recovery: retry
      action:
        capability: inventory-review-handoffs
        type: inventory_review_handoffs
        payload: >-
          {"scope":{"kind":"last_n","count":10,"history":"first_parent","head":"HEAD"}}
        input-bindings:
          - input: review.scope
            target: /scope
      verify-spec:
        type: task_result_assert
        task-result-assertions:
          - { pointer: /runtime_outputs/review_handoff_inventory/passed, op: equals, value: true }

    - id: synthesize-review
      agent: synthesizer
      phase: verify
      optional: true
      result-contract: { schema: schemas/report-v1.json, require-structured: true }
      constraints: |-
        PREPARE Runtime Outputs (receipt-verified; copy these JSON values verbatim):
        scope: {scope_attestation}
        targeted_go_tests: {test_attestation}
        Review Handoff Inventory (receipt-verified; every listed required source must have a critic-review dependency):
        {handoff_inventory}
      fact_refs:
        - { name: scope_attestation, task_id: produce-workset, runtime_output: scope }
        - { name: test_attestation, task_id: verify-targeted-go-tests, runtime_output: targeted_go_tests }
        - { name: handoff_inventory, task_id: inventory-review-handoffs, runtime_output: review_handoff_inventory }
      execution:
        requires-result: true
        requires-grounded-result: true
        requires-evidence: true
        # The producer permits 32 total reviews; each may require one critic.
        max-evidence-sources: 64
        forbid-artifacts: true
      verify-spec:
        type: task_result_assert
        task-result-assertions:
          - { pointer: /summary, op: non_empty }
          - { pointer: /files_read, op: min_items, value: 1 }

    - id: verify-review-report
      agent: reviewer
      phase: verify
      optional: true
      side_effect: none
      recovery: retry
      action:
        capability: verify-review-report
        type: verify_review_report
        payload: >-
          {"scope":{"kind":"last_n","count":10,"history":"first_parent","head":"HEAD"}}
        input-bindings:
          - input: review.scope
            target: /scope
      verify-spec:
        type: task_result_assert
        task-result-assertions:
          - { pointer: /runtime_outputs/review_report_verification/passed, op: equals, value: true }
