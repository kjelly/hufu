apiVersion: hufu.io/v1alpha1
kind: AgentTeam
metadata:
  name: hufu-dev
spec:
  description: "Hufu-specific development team with domain analysis, single-writer implementation, and independent verification"
  max-rounds: 14
  max-steps: 100
  timeout: 3300
  max-retries: 1
  max-concurrent: 2
  workspace: workspace
  temperature: "0.2"
  max-tokens: "8192"
  unattended: false
  # This is a code-changing team: completion must be an objective outcome, not
  # the default exploratory/profile-advisory result.
  goal-mode: outcome
  # Record which persistent memories workers apply and whether their task
  # verify passes, without changing prompt selection. Implementation and
  # analysis tasks run in the execute phase, so learned knowledge reaches
  # them; accepted runs (the blocking acceptance below) add to it. Retire
  # stale knowledge with `hufu context retire`; set mode off to stop.
  memory-learning:
    mode: observe
  delegation:
    # LoadTeam always provides a general-purpose Helper. Keep it unreachable so
    # implementation-engineer remains the only worker with write authority.
    allowed-workers:
      - runtime-engineer
      - integration-engineer
      - implementation-engineer
      - verifier
    no-redispatch-after-success:
      - runtime-engineer
      - integration-engineer
      - implementation-engineer
      - verifier
    # Workers see only the task the maintainer writes. A one-line goal once
    # dropped the user's explicit requirements and gave the implementation no
    # verify check, so its tasks must carry constraints and verify, and the
    # implementer and verifier also see the original request to check against.
    require-task-contract:
      - implementation-engineer
    share-request-with:
      - implementation-engineer
      - verifier
  acceptance:
    mode: blocking
    require-no-unresolved-tasks: true
    commands:
      - go test ./...
      - go vet ./...
      - golangci-lint run
