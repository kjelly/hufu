name: dev-team
description: "A full-stack development team for building features"
max-rounds: 10
timeout: 3300
model: ollama/glm-5.1:cloud
model-list:
- id: ollama/deepseek-v4:flash
  details: |-
    極低延遲與高頻工具調用 (MCP)
    第一線執行者 / 終端機助理
    輕量化，首字節延遲極低
    結合 Talon Voice 語音轉文字，在終端機內極速產生並執行 Nushell 指令
    作為 MCP 伺服器的快速介接節點，實現毫秒級的基礎工具呼叫
- id: ollama/deepseek-v4-pro:cloud
  details: |-
    頂尖程式碼生成與深度系統架構推演
    核心開發工程師
    兼具高品質輸出與合理的運算成本
    處理 k3s, rke2, AWS EKS 的複雜雲原生 YAML 配置與部署邏輯
    建構具有嚴格網路存取限制與權限隔離的 AI 代理 Docker 沙盒環境
    撰寫具有複雜業務邏輯與底層依賴關係的後端模組
- id: ollama/gpt-oss:120b
  details: |-
    原生可控思維鏈 (CoT) 與強大開源體質
    本地端深度除錯大腦
    極度適合在本地高階硬體或叢集上進行高精度量化部署
    在本地 40 節點超級電腦叢集中進行高隱私的底層網路 (如 100G Switch MTU) 問題推演
    針對編譯失敗或複雜的系統錯誤進行多步驟的自我反思與修復
- id: ollama/kimi-k2.6:cloud
  details: |-
    無損超長上下文推理與跨文件邏輯追蹤
    全域架構師 / 技術手冊稽核
    單次吞吐龐大專案結構，但推理耗時相對較長
    作為 Project Tether 的核心引擎，完整讀取 Codebase 並產出極高準確度的技術手冊
    執行牽涉數十個檔案與跨服務邊界的大型 Pull Request 審查，防止架構性破壞
- id: ollama/kimi-k2.5:cloud
  details: |-
    長上下文快速吞吐
    API 文件快速解析器
    處理中長篇幅文件的速度與成本效益佳
    快速閱讀並總結大量的第三方 API 規格文件或開源套件使用手冊
- id: ollama/glm-5.1:cloud
  details: |-
    超長線任務與狀態保持穩定度
    全自動自主 Agent / 記憶管理員
    在數百輪的對話或工具呼叫中不易丟失初始目標
    維護自動化記憶數位秘書系統，精確且持續地管理 agents.md, stm.md, ltm.md 的讀寫循環
    執行長週期的端到端 (End-to-End) 軟體測試與封裝部署任務
- id: ollama/minimax-m2.7:cloud
  details: |-
    多智能體 (Multi-Agent) 協作與極高指令服從度
    專案經理 / Agent 協調者
    高達 97% 的複雜工具遵循率
    拆解大型開發任務，並精準將子任務分派給前端、後端與測試等不同職責的 Sub-agents
- id: ollama/nemotron-3-super:cloud
  details: |-
    企業級 RAG 與向量檢索優化
    Codebase 檢索專家
    針對大規模資料庫與程式碼庫的快速檢索與精準問答優化
    在龐大的微服務架構中，透過向量資料庫快速定位特定的程式碼依賴關係與歷史變更紀錄
- id: ollama/qwen3.5:397b-cloud
  details: |-
    純邏輯運算與演算法天花板
    極端難題解決者
    巨無霸參數模型，運算成本最高，但具備降維打擊的智力
    設計或優化極度複雜的底層分散式演算法或資料結構
    解決其他模型陷入死胡同、牽一髮動全身的基礎設施架構缺陷
- id: ollama/gemma4:31b-cloud
  details: |-
    輕巧與極高的性價比
    即時程式碼補全
    反應靈敏，適合串流式的小片段生成
    整合至 Neovim 等編輯器中，提供流暢的行內 (Inline) 程式碼自動補全功能
    處理日常簡短的語法詢問或簡單的正則表達式撰寫
