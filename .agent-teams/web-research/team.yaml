name: web-research
description: "Independently research factual claims online, verify source evidence, and report uncertainty"
goal-mode: outcome
max-rounds: 8
max-concurrent: 2
max-retries: 1
allow-free-text-results: false
# PREPARE runs both independent searches; VERIFY audits their accepted inputs.
# Skipping permits omission of the unused AUDIT/EXECUTE phases, not bypassing
# either required research contract or the final evidence audit.
workflow:
  phases: [prepare, verify]
policies:
  require_phase_success: true
  allow_phase_skip: true
  fail_fast: false
verification:
  required: true
tools:
  denied: [web_fetch, write, edit, multiedit, bash, sudo, ssh, scp, lua, golang, download, fetch, agentic_fetch, grep, glob, ls, random, math]
requires:
  environment: [OLLAMA_API_KEY]
# Research goals are mostly Chinese, which lexical retrieval cannot read; the
# semantic lane raised replayed memory usefulness from 0.47 to 0.69 with
# score_normalized fusion (legacy fusion left it without effect).
semantic-retrieval:
  mode: active
  fusion: score_normalized
# Each track has its own browser context so parallel research stays independent.
mcp-servers:
  playwright_researcher:
    type: local
    temporary-directory-env: [PLAYWRIGHT_MCP_OUTPUT_DIR]
    command: [npx, -y, '@playwright/mcp@latest', --headless, --isolated, --browser, chromium, --image-responses, omit, --snapshot-mode, none, --codegen, none, --no-webmcp]
    allowedTools: [browser_navigate, browser_snapshot]
    toolPolicies:
      browser_navigate:
        sideEffect: none
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url: {type: string, maxLength: 4096, pattern: '^https?://[^\s]+$'}
      browser_snapshot:
        sideEffect: none
        filesystem: none
        inputSchema: {type: object, additionalProperties: false, properties: {}}
  playwright_countercheck:
    type: local
    temporary-directory-env: [PLAYWRIGHT_MCP_OUTPUT_DIR]
    command: [npx, -y, '@playwright/mcp@latest', --headless, --isolated, --browser, chromium, --image-responses, omit, --snapshot-mode, none, --codegen, none, --no-webmcp]
    allowedTools: [browser_navigate, browser_snapshot]
    toolPolicies:
      browser_navigate:
        sideEffect: none
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url: {type: string, maxLength: 4096, pattern: '^https?://[^\s]+$'}
      browser_snapshot:
        sideEffect: none
        filesystem: none
        inputSchema: {type: object, additionalProperties: false, properties: {}}
  playwright_verifier:
    type: local
    temporary-directory-env: [PLAYWRIGHT_MCP_OUTPUT_DIR]
    command: [npx, -y, '@playwright/mcp@latest', --headless, --isolated, --browser, chromium, --image-responses, omit, --snapshot-mode, none, --codegen, none, --no-webmcp]
    allowedTools: [browser_navigate, browser_snapshot]
    toolPolicies:
      browser_navigate:
        sideEffect: none
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url: {type: string, maxLength: 4096, pattern: '^https?://[^\s]+$'}
      browser_snapshot:
        sideEffect: none
        filesystem: none
        inputSchema: {type: object, additionalProperties: false, properties: {}}
delegation:
  bind-task-goal-contracts: true
  allowed-workers: [researcher, countercheck, verifier]
  no-redispatch-after-success: [researcher, countercheck, verifier]
  share-request-with: [researcher, countercheck, verifier]
  forbid-context-files: true
acceptance:
  mode: blocking
  require-no-unresolved-tasks: true
  required-workers: [researcher, countercheck, verifier]
  # A finished search that records an inaccessible source reports
  # completed_with_gaps; that still completes the research stage.
  required-workers-accept-gaps: true
contracts:
  - id: primary-research
    agent: researcher
    phase: prepare
    side_effect: none
    recovery: retry
    max_retries: 1
    execution:
      requires-result: true
      requires-grounded-result: true
    verify-spec:
      type: task_result_assert
      task-result-assertions:
        - {pointer: /structured_payload/value/lens, op: equals, value: primary_search}
        - {pointer: /structured_payload/value/findings, op: min_items, value: 1}
  - id: counter-research
    agent: countercheck
    phase: prepare
    side_effect: none
    recovery: retry
    max_retries: 1
    execution:
      requires-result: true
      requires-grounded-result: true
    verify-spec:
      type: task_result_assert
      task-result-assertions:
        - {pointer: /structured_payload/value/lens, op: equals, value: countercheck}
        - {pointer: /structured_payload/value/findings, op: min_items, value: 1}
  - id: evidence-audit
    agent: verifier
    phase: verify
    side_effect: none
    recovery: retry
    max_retries: 1
    execution:
      requires-result: true
      requires-grounded-result: true
      requires-evidence: true
    verify-spec:
      type: task_result_assert
      task-result-assertions:
        - {pointer: /structured_payload/value/audit_complete, op: equals, value: true}
        - {pointer: /structured_payload/value/findings, op: min_items, value: 1}
