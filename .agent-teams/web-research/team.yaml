name: web-research
description: "Independently research factual claims online, verify source evidence, and synthesize an evidence-qualified answer"
goal-mode: outcome
request-acceptance: true
result-transport: runtime
worker-model: ollama/minimax-m3:cloud
coordinator-model: ollama/minimax-m3:cloud
sidecar-model: ollama/minimax-m3:cloud
collector-response-channel: text_json
max-rounds: 8
max-concurrent: 2
max-retries: 1
allow-free-text-results: false
# PREPARE: independent research; AUDIT: verifier; VERIFY: synthesis.
# Skipping omits unused EXECUTE, never a required research/audit/synthesis task.
workflow:
  phases: [prepare, audit, verify]
policies:
  require_phase_success: true
  allow_phase_skip: true
  fail_fast: false
verification:
  required: true
tools:
  denied: [web_fetch, write, edit, multiedit, bash, sudo, ssh, scp, lua, golang, download, fetch, agentic_fetch, grep, glob, ls, random, math]
requires:
  environment: [OLLAMA_API_KEY]
# Research goals are mostly Chinese, which lexical retrieval cannot read; the
# semantic lane raised replayed memory usefulness from 0.47 to 0.69 with
# score_normalized fusion (legacy fusion left it without effect).
semantic-retrieval:
  mode: active
  fusion: score_normalized
# Each declaration owns a dedicated Chrome tab; profile cookies are shared.
# Legacy logical names keep existing snapshot evidence identifiers stable.
mcp-servers:
  playwright_researcher:
    type: chrome-cdp
    page-verification: true
    url: http://127.0.0.1:9222
    page-dwell: {min-seconds: 300, max-seconds: 600}
    allowedTools: [browser_navigate, browser_snapshot, browser_click, browser_wait_for_user]
    toolPolicies:
      browser_navigate:
        sideEffect: none
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url: {type: string, maxLength: 4096, pattern: '^https?://[^\s]+$'}
      browser_snapshot:
        sideEffect: none
        filesystem: none
        inputSchema: {type: object, additionalProperties: false, properties: {}}
      browser_click:
        sideEffect: browser_interaction
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [ref]
          properties:
            ref: {type: string, minLength: 1, maxLength: 128}
      browser_wait_for_user:
        sideEffect: none
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [reason]
          properties:
            reason: {type: string, minLength: 1, maxLength: 2000}
  playwright_countercheck:
    type: chrome-cdp
    page-verification: true
    url: http://127.0.0.1:9222
    page-dwell: {min-seconds: 300, max-seconds: 600}
    allowedTools: [browser_navigate, browser_snapshot, browser_click, browser_wait_for_user]
    toolPolicies:
      browser_navigate:
        sideEffect: none
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url: {type: string, maxLength: 4096, pattern: '^https?://[^\s]+$'}
      browser_snapshot:
        sideEffect: none
        filesystem: none
        inputSchema: {type: object, additionalProperties: false, properties: {}}
      browser_click:
        sideEffect: browser_interaction
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [ref]
          properties:
            ref: {type: string, minLength: 1, maxLength: 128}
      browser_wait_for_user:
        sideEffect: none
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [reason]
          properties:
            reason: {type: string, minLength: 1, maxLength: 2000}
  playwright_verifier:
    type: chrome-cdp
    page-verification: true
    url: http://127.0.0.1:9222
    page-dwell: {min-seconds: 300, max-seconds: 600}
    allowedTools: [browser_navigate, browser_snapshot, browser_click, browser_wait_for_user]
    toolPolicies:
      browser_navigate:
        sideEffect: none
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url: {type: string, maxLength: 4096, pattern: '^https?://[^\s]+$'}
      browser_snapshot:
        sideEffect: none
        filesystem: none
        inputSchema: {type: object, additionalProperties: false, properties: {}}
      browser_click:
        sideEffect: browser_interaction
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [ref]
          properties:
            ref: {type: string, minLength: 1, maxLength: 128}
      browser_wait_for_user:
        sideEffect: none
        filesystem: none
        inputSchema:
          type: object
          additionalProperties: false
          required: [reason]
          properties:
            reason: {type: string, minLength: 1, maxLength: 2000}
delegation:
  bind-task-goal-contracts: true
  allowed-workers: [researcher, countercheck, verifier, synthesizer]
  no-redispatch-after-success: [researcher, countercheck, verifier, synthesizer]
  share-request-with: [researcher, countercheck, verifier, synthesizer]
  forbid-context-files: true
acceptance:
  mode: blocking
  require-no-unresolved-tasks: true
  required-workers: [researcher, countercheck, verifier, synthesizer]
  # A finished search that records an inaccessible source reports
  # completed_with_gaps; that still completes the research stage.
  required-workers-accept-gaps: true
contracts:
  - id: primary-research
    agent: researcher
    phase: prepare
    side_effect: browser_interaction
    recovery: manual
    max_retries: 0
    execution:
      requires-result: true
      requires-grounded-result: true
    verify-spec:
      type: task_result_assert
      task-result-assertions:
        - {pointer: /structured_payload/value/lens, op: equals, value: primary_search}
        - {pointer: /structured_payload/value/findings, op: min_items, value: 1}
  - id: counter-research
    agent: countercheck
    phase: prepare
    side_effect: browser_interaction
    recovery: manual
    max_retries: 0
    execution:
      requires-result: true
      requires-grounded-result: true
    verify-spec:
      type: task_result_assert
      task-result-assertions:
        - {pointer: /structured_payload/value/lens, op: equals, value: countercheck}
        - {pointer: /structured_payload/value/findings, op: min_items, value: 1}
  - id: evidence-audit
    agent: verifier
    phase: audit
    side_effect: browser_interaction
    recovery: manual
    max_retries: 0
    execution:
      requires-result: true
      requires-grounded-result: true
      requires-evidence: true
      max-evidence-sources: 2
    verify-spec:
      type: task_result_assert
      task-result-assertions:
        - {pointer: /structured_payload/value/audit_complete, op: equals, value: true}
        - {pointer: /structured_payload/value/findings, op: min_items, value: 1}
  - id: research-synthesis
    agent: synthesizer
    phase: verify
    side_effect: none
    recovery: retry
    max_retries: 1
    execution:
      requires-result: true
      requires-grounded-result: true
      requires-evidence: true
      max-evidence-sources: 1
      tool-sequence: [submit_result]
    verify-spec:
      type: task_result_assert
      task-result-assertions:
        - {pointer: /structured_payload/value/synthesis_complete, op: equals, value: true}
        - {pointer: /structured_payload/value/input_review, op: min_items, value: 1}
        - {pointer: /structured_payload/value/input_review/0/audit_complete, op: equals, value: true}
        - {pointer: /structured_payload/value/answer, op: min_items, value: 1}
