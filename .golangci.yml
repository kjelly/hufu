version: "2"
run:
  tests: true
linters:
  enable:
    - dupl
    - gocyclo
    - misspell
    - nakedret
    - unconvert
    - whitespace
  settings:
    dupl:
      threshold: 300
    gocyclo:
      # Ratchet plan: 95 -> 40 (done) -> 25 -> 15-20. Lower this as the
      # remaining large functions are decomposed; do not raise it.
      min-complexity: 40
  exclusions:
    generated: lax
    # Policy: new code must not add exclusions. Each remaining entry below is
    # lint debt to burn down — remove entries as their files are cleaned up
    # (see tmp/bug.txt P1 "lint 門檻實際上過於寬鬆").
    rules:
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - ineffassign
          - misspell
          - nakedret
          - staticcheck
          - unconvert
          - unused
          - whitespace
        path: _test\.go
      - linters:
          - gocyclo
        path: tui/tui\.go
      - linters:
          - gocyclo
        path: tui/ask_user\.go
      - linters:
          - gocyclo
        path: cmd/hufu/display\.go
      # gocyclo debt from lowering min-complexity 95 -> 40: each entry below
      # names one function that predates the new threshold. Remove the entry
      # when that function is decomposed; do not add new ones.
      - linters: # runChat: 50
          - gocyclo
        path: cmd/hufu/chat\.go
      - linters: # (*Coordinator).ExecuteTasks: 65
          - gocyclo
        path: internal/team/coordinator_execute\.go
      - linters: # (*Coordinator).executeTask: 95
          - gocyclo
        path: internal/team/coordinator_task_run\.go
      - linters: # ClassifyLTMEntry: 85
          - gocyclo
        path: internal/team/ltm\.go
      - linters: # parseTeamYML: 45
          - gocyclo
        path: internal/team/parse\.go
      - linters: # executeSCP: 47
          - gocyclo
        path: internal/tools/scp\.go
      - linters: # executeSSH: 56
          - gocyclo
        path: internal/tools/ssh\.go
      - linters:
          - errcheck
        path: internal/tools/download\.go
      - linters:
          - errcheck
        path: internal/tools/env\.go
      - linters:
          - errcheck
        path: internal/tools/fetch\.go
      - linters:
          - errcheck
        path: internal/tools/glob\.go
      - linters:
          - errcheck
        path: internal/tools/golang\.go
      - linters:
          - errcheck
        path: internal/tools/lua\.go
      - linters:
          - errcheck
        path: internal/tools/ssh_config\.go
      - linters:
          - errcheck
          - ineffassign
        path: internal/tools/ssh\.go
      - linters:
          - unused
        path: internal/tools/truncate\.go
      - linters:
          - staticcheck
        path: internal/tools/ask_user\.go
      - linters:
          - unused
        path: internal/skill/discovery\.go
      - linters:
          - errcheck
        path: internal/skill/generator\.go
      - linters:
          - unused
        path: internal/sidecar/sidecar_test\.go
      - linters:
          - errcheck
          - staticcheck
          - unused
        path: internal/team/coordinator\.go
      - linters:
          - errcheck
          - unused
        path: internal/team/ltm\.go
      - linters:
          - unused
        path: internal/team/parse\.go
      - linters:
          - unused
        path: internal/team/stm\.go
      - linters:
          - errcheck
          - unused
        path: internal/team/workspace\.go
      - linters:
          - ineffassign
        path: internal/team/prompt\.go
      - linters:
          - ineffassign
        path: internal/utils/preview\.go
      - linters:
          - errcheck
        path: internal/tools/view\.go
      - linters:
          - errcheck
        path: internal/tools/tools\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/anomalyco/hufu
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - _test\.go
      - internal/sidecar/sidecar_fallback_test\.go
      - internal/team/coordinator\.go
      - internal/team/services\.go
      - internal/team/parse\.go
      - internal/team/status\.go
      - internal/team/check_duplicate_test\.go
      - internal/team/dedup_test\.go
      - internal/tools/common\.go
      - internal/tools/math\.go
      - internal/tools/scp\.go
      - internal/tools/ssh\.go
      - internal/tools/tools\.go
      - internal/tools/types\.go
      - internal/utils/preview\.go
      - internal/skill/discovery\.go
      - internal/skill/generator\.go
